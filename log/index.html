<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系統日誌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-deep:#141d33;
      --sky:#1c2b4a;
      --sky-card:#24375e;
      --moon:#f5cf82;
      --moon-soft:#fbe7b8;
      --lantern:#e8703a;
      --lantern-soft:#f0956a;
      --text:#f3ecdc;
      --text-dim:#b9c2d6;
      --line:rgba(245,207,130,0.18);
      --success:#8de7b5;
      --danger:#f7a98a;
      --shadow:rgba(0,0,0,0.22);
    }

    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:'Noto Sans TC', sans-serif;
      background:
        radial-gradient(ellipse 600px 300px at 82% -5%, rgba(245,207,130,0.15), transparent 60%),
        linear-gradient(180deg, var(--sky-deep) 0%, var(--sky) 55%, #0f1626 100%);
      color:var(--text);
      min-height:100vh;
      padding:32px 16px 80px;
    }

    .wrap {
      max-width:820px;
      margin:0 auto;
    }

    .hero {
      text-align:center;
      padding:8px 0 20px;
    }

    .hero h1 {
      margin:0;
      font-size:30px;
      font-weight:900;
      letter-spacing:0.04em;
    }

    .hero p {
      margin:8px 0 0;
      color:var(--text-dim);
      font-size:14px;
      line-height:1.7;
    }

    .topbar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-bottom:16px;
      flex-wrap:wrap;
    }

    .btn {
      font-family:inherit;
      cursor:pointer;
      border:none;
      border-radius:12px;
      padding:10px 16px;
      font-weight:700;
      transition:transform 0.15s ease, opacity 0.15s ease;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    .btn:hover { transform:translateY(-1px); }
    .btn:active { transform:translateY(0); }

    .btn-primary {
      background:linear-gradient(135deg, var(--lantern), var(--lantern-soft));
      color:#1c1206;
    }

    .btn-secondary {
      background:rgba(245,207,130,0.12);
      color:var(--moon);
      border:1px solid rgba(245,207,130,0.2);
    }

    .status {
      background:rgba(255,255,255,0.04);
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px 16px;
      color:var(--text-dim);
      font-size:14px;
      margin-bottom:18px;
      box-shadow:0 8px 22px var(--shadow);
    }

    .card {
      background:var(--sky-card);
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,0.25);
    }

    .card-header {
      padding:18px 20px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .card-header h2 {
      margin:0;
      font-size:18px;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .dot {
      width:9px;
      height:9px;
      background:var(--lantern);
      border-radius:50%;
      box-shadow:0 0 10px rgba(232,112,58,0.8);
    }

    .count {
      color:var(--moon);
      font-weight:800;
      font-size:13px;
    }

    .list {
      list-style:none;
      margin:0;
      padding:0;
    }

    .log-item {
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      display:grid;
      grid-template-columns: 122px 1fr;
      gap:14px;
    }

    .log-item:last-child { border-bottom:none; }

    .time {
      color:var(--text-dim);
      font-size:12.5px;
      line-height:1.55;
      white-space:nowrap;
    }

    .content {
      min-width:0;
    }

    .action {
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      background:rgba(245,207,130,0.12);
      color:var(--moon);
      border:1px solid rgba(245,207,130,0.2);
      font-size:12px;
      font-weight:700;
      margin-bottom:6px;
    }

    .meta {
      color:var(--text);
      font-size:14px;
      line-height:1.7;
      word-break:break-word;
    }

    .meta strong {
      color:var(--moon-soft);
      font-weight:700;
    }

    .empty {
      padding:42px 18px;
      text-align:center;
      color:var(--text-dim);
      font-size:14px;
    }

    @media (max-width: 640px) {
      .log-item {
        grid-template-columns: 1fr;
      }
      .time {
        white-space:normal;
      }
      .topbar {
        justify-content:center;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>系統日誌</h1>
      <p>記錄所有新增、刪除、認領、分類及登入登出等變更。</p>
    </div>

    <div class="topbar">
      <a class="btn btn-secondary" href="../中秋烤肉登記.html">← 回到登記頁</a>
      <button class="btn btn-primary" id="refreshBtn" type="button">重新整理</button>
    </div>

    <div class="status" id="statusText">讀取中…</div>

    <div class="card">
      <div class="card-header">
        <h2><span class="dot"></span>變更紀錄</h2>
        <div class="count" id="logCount">0 筆</div>
      </div>
      <ul class="list" id="logList"></ul>
      <div class="empty" id="emptyState" style="display:none;">目前沒有系統日誌。</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: 'AIzaSyDjIuZph6b0f2MINUtUji4dI3c6b1BivU0',
      authDomain: 'bbq-88bd2.firebaseapp.com',
      databaseURL: 'https://bbq-88bd2-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId: 'bbq-88bd2',
      storageBucket: 'bbq-88bd2.firebasestorage.app',
      messagingSenderId: '206941577914',
      appId: '1:206941577914:web:4e45af0fc613237e399883'
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();
    const logsRef = database.ref('bbq-logs');
    const logList = document.getElementById('logList');
    const logCount = document.getElementById('logCount');
    const statusText = document.getElementById('statusText');
    const emptyState = document.getElementById('emptyState');

    function formatTimestamp(value) {
      if (!value) return '未知時間';
      const ts = typeof value === 'number' ? value : Number(value);
      if (Number.isNaN(ts)) return '未知時間';
      try {
        const date = new Date(ts);
        return `${date.toLocaleDateString('zh-TW')} ${date.toLocaleTimeString('zh-TW', { hour12: false })}`;
      } catch (error) {
        return '未知時間';
      }
    }

    function renderLog(entry) {
      const actor = entry.actor && entry.actor.name ? entry.actor.name : '訪客';
      const details = entry.details || {};
      const lines = [];

      if (details.itemName) lines.push(`食材：${details.itemName}`);
      if (details.category) lines.push(`分類：${details.category}`);
      if (details.from && details.to) lines.push(`分類變更：${details.from} → ${details.to}`);
      if (details.claimedBy) lines.push(`認領人：${details.claimedBy}`);
      if (details.email) lines.push(`電子郵件：${details.email}`);
      if (details.displayName) lines.push(`姓名：${details.displayName}`);

      const detailsText = lines.length ? lines.join(' / ') : '無額外說明';

      const li = document.createElement('li');
      li.className = 'log-item';
      li.innerHTML = `
        <div class="time">${formatTimestamp(entry.timestamp)}</div>
        <div class="content">
          <div class="action">${entry.action || '系統變更'}</div>
          <div class="meta"><strong>${escapeHtml(actor)}</strong>：${escapeHtml(detailsText)}</div>
        </div>
      `;
      return li;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str ?? '');
      return div.innerHTML;
    }

    function renderLogs(entries) {
      logList.innerHTML = '';
      const sorted = entries.sort((a, b) => Number(b.timestamp || 0) - Number(a.timestamp || 0));
      if (!sorted.length) {
        emptyState.style.display = 'block';
        logCount.textContent = '0 筆';
        return;
      }
      emptyState.style.display = 'none';
      logCount.textContent = `${sorted.length} 筆`;
      sorted.forEach((entry) => logList.appendChild(renderLog(entry)));
    }

    function loadLogs() {
      logsRef.orderByChild('timestamp').limitToLast(200).on('value', (snapshot) => {
        const data = snapshot.val() || {};
        const entries = Object.entries(data).map(([id, value]) => ({ id, ...value }));
        renderLogs(entries);
      }, (error) => {
        console.error('Load logs failed:', error);
        statusText.textContent = '日誌載入失敗，請確認 Firebase 設定與資料庫規則。';
      });
    }

    auth.onAuthStateChanged((user) => {
      if (user) {
        statusText.textContent = `已登入：${user.displayName || user.email || '使用者'}，正在讀取日誌…`;
        loadLogs();
      } else {
        statusText.textContent = '請先在主頁登入，才能查看系統日誌。';
        logList.innerHTML = '';
        emptyState.style.display = 'block';
        logCount.textContent = '0 筆';
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', () => {
      statusText.textContent = '重新整理中…';
      if (auth.currentUser) {
        loadLogs();
        statusText.textContent = `已登入：${auth.currentUser.displayName || auth.currentUser.email || '使用者'}，已更新日誌。`;
      } else {
        statusText.textContent = '請先在主頁登入，才能查看系統日誌。';
      }
    });
  </script>
</body>
</html>
